[project]
name = "grad-econ-datascience"
version = "0.1.0"
description = "Graduate Quantitative Economics and Datascience (ECON526, UBC)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ipykernel>=6.29.5",
    "ipython>=9.1.0",
    "jupyter>=1.1.1",
    "jupyter-cache>=1.0.1",
    "matplotlib>=3.10.5",
    "nbconvert>=7.16.6",
    "numpy>=2.2",
    "pandas>=2.3.1",
    "ruff>=0.11.4",
    "scikit-learn>=1.7.1",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.14.5",
    "tiktoken>=0.12.0",
    "jinja2>=3.1.6",
    "huggingface-hub>=1.29.0",
    "datasets>=5.0.1",
    "openai>=3.6.0",
]

[project.optional-dependencies]
extras = [
    "geopandas>=1.1.4",
    "langchain>=1.4.0",
    "langchain-openai>=1.6.0",
    "openpyxl>=3.1.5",
    "torch>=2.14.0",
    "transformers>=5.16.1",
]
spatial = [
    "geopandas>=1.1.4",
    "openpyxl>=3.1.5",
]
